[pytest]
testpaths = tests
python_files = test_*.py
# No -q: it suppresses pytest_report_header, and that header is what tells you
# whether gams.transfer was real or stubbed. A green run must never hide which
# tier actually executed. -ra surfaces skip reasons for the same purpose.
# -rfEs, not -ra: known xfails are a register, not news, and listing all of them
# buries the real signal. Strict XPASS still reports as a failure, so a fixed
# issue that kept its exemption cannot hide.
addopts = -rfEs --strict-markers --strict-config --tb=short
# The suite is clean of both, so both are errors. This is the only way these
# stay clean: they are warnings precisely because nothing forces you to act,
# and they become hard errors on a later release.
#
# FutureWarning: utils.fill_numeric_na / fill_all_na exist to avoid the pandas
#   one raised by filling NA on a mixed-dtype frame. Erroring locks that in, so
#   a new fillna on an object column fails here rather than in a year's time.
# DeprecationWarning: caught pd.Timedelta(hours=n) under numpy 2.5, which the
#   keyword form triggers while pd.Timedelta(n, unit="h") does not.
#
# Both are sensitive to package versions, so an env rebuild may introduce noise
# from a dependency rather than from this project. When that happens, add a
# targeted ignore naming the package and the date -- do not drop the error
# rule, and do not silence a warning our own code raises.
filterwarnings =
    error::FutureWarning
    error::DeprecationWarning

markers =
    route: full source-xlsx -> inputData.xlsx run (seconds, not milliseconds)
    entrypoint: drives build_input_data.main(); the slowest tier
    contract: dtype/NA contract sweeps over the nasty-value catalogue
    gams: needs the real GAMS Python API; skipped while the conftest stub is active

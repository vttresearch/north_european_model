# Python environment for building Backbone input data.
#
#   conda env create -f environment.yml
#   conda activate northEuropeanModel
#   pip install gamsapi[transfer]==xx.y.z
#
# where xx.y.z is YOUR GAMS version (GAMS Studio -> Help -> GAMS Licensing, or
# `gams audit`). gamsapi is intentionally not listed below: it is tied to a GAMS
# version, and it is not on conda-forge. Install it with pip into this env.
#
# More than one GAMS installed? src/GDX_exchange.py binds gams.transfer to the
# install whose major version matches the gamsapi you pinned, so this normally
# needs no configuration. To override, set BB_GAMS_API to the GAMS folder, e.g.
# BB_GAMS_API=C:\GAMS\47 -- the same variable the parent Backbone repo uses.
# Without a deliberate binding, gams.transfer attaches to whichever GAMS was
# installed last and warns on every container.
#
# Miniconda or Anaconda? A fresh install stops `conda env create` at a Terms of
# Service prompt for Anaconda's own channels, even though this file asks only for
# conda-forge. Those terms can require a paid licence in larger organisations;
# Miniforge (github.com/conda-forge/miniforge) is configured for conda-forge alone
# and never asks.
name: northEuropeanModel
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pandas=2.2
  # OpenBLAS, not MKL: MKL loads its kernels by name at first use and finds them only
  # when the env is activated, so an interpreter started by path (a Jupyter kernel,
  # a .cmd wrapper, an IDE) dies on np.dot or np.linalg with 0xC06D007F and no
  # traceback. OpenBLAS is one DLL and works however the interpreter is started.
  - libblas=*=*openblas
  - pyarrow
  - tqdm
  - openpyxl
  - matplotlib
  # Below 9.1: pytest 9.1.1 errors 16 tests in setup with `assert not
  # self._finalizers` -- every one a scope="class" fixture defined as a method
  # inside its test class. 9.0.3 passes the whole suite.
  - pytest<9.1
